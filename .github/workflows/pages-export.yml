name: Export Iron Flight to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/templates/index.html"
      - "app/static/**"
      - "tools/export_pages.py"
      - ".github/workflows/pages-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export static game to docs
        run: python tools/export_pages.py
      - name: Commit changed static demo
        run: |
          if ! git diff --quiet -- docs || [ -n "$(git ls-files --others --exclude-standard docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Update GitHub Pages playable demo [skip ci]"
            git push
          else
            echo "Static demo already up to date"
          fi
